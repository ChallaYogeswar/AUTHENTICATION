version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: enterprise-auth-postgres
    environment:
      POSTGRES_DB: enterprise_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - enterprise-auth

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: enterprise-auth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - enterprise-auth

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise-auth-backend
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_DATABASE: enterprise_auth
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ent2-a7f3b9c1d8e5f2a4b6c8d0e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c3d5e7f9
      BCRYPT_ROUNDS: 12
      SESSION_SECRET: ent2-sess-x9k2m4p6r8t0v2w4y6a8c0e2g4i6k8m0o2q4s6u8w0y2
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      TWILIO_API_KEY_SID: ""
      TWILIO_API_KEY_SECRET: ""
      TWILIO_PHONE_NUMBER: "+1234567890"
      SENDGRID_API_KEY: ""
      FROM_EMAIL: noreply@localhost
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - enterprise-auth

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enterprise-auth-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - enterprise-auth

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: enterprise-auth-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - enterprise-auth

volumes:
  postgres_data:
  redis_data:

networks:
  enterprise-auth:
    driver: bridge
